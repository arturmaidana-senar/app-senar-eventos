buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Remove stale RN 0.79 codegen file shipped inside react-native-camera-kit@17.0.1 npm package
def staleCameraKitCpp = file("../node_modules/react-native-camera-kit/android/build/generated/source/codegen/jni/react/renderer/components/NativeCameraKitSpec/NativeCameraKitSpecJSI-generated.cpp")
if (staleCameraKitCpp.exists()) {
    staleCameraKitCpp.text = "// Intentionally left empty: stale RN 0.79 codegen artifact shipped in react-native-camera-kit\n"
}

